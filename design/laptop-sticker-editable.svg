<svg xmlns="http://www.w3.org/2000/svg" width="101.6mm" height="63.22mm" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">The Friday Commit, Charlotte Code &amp; Coffee laptop sticker</title>
  <desc id="desc">The Friday Commit in large Dracula pink and off-white lettering with a purple terminal cursor and the original terminal mug. Code &amp; Coffee below. fridaycommit.dev.</desc>
  <!-- Transparent corners. The cream silhouette is the intended finished sticker edge. -->
  <rect x="8" y="8" width="884" height="544" rx="40" fill="#F8F8F2"/>
  <rect x="18" y="18" width="864" height="524" rx="31" fill="#282A36"/>
  <g font-family="Liberation Mono, monospace">
    <text x="60" y="97" font-size="42" fill="#F8F8F2">The</text>
    <text x="55" y="211" font-size="100" font-weight="700" fill="#FF79C6">Friday</text>
    <text x="55" y="312" font-size="100" font-weight="700" fill="#F8F8F2">Commit<tspan fill="#BD93F9">_</tspan></text>
    <text x="60" y="398" font-size="29" fill="#8BE9FD"><tspan fill="#FF79C6">&gt;</tspan> coffee <tspan fill="#BD93F9">--with</tspan> engineers</text>
    <text x="60" y="494" font-size="26" font-weight="700" fill="#FF79C6">Code <tspan fill="#BD93F9">&amp;</tspan><tspan fill="#F8F8F2"> Coffee</tspan></text>
    <text x="590" y="494" font-size="26" fill="#F8F8F2">fridaycommit.dev</text>
  </g>
  <!-- Original hand-authored mug paths, enlarged without a surrounding badge. -->
  <g transform="translate(605 133) scale(2.05)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 30 H72 V64 Q72 83 54 83 H31 Q13 83 13 64 Z M72 40 H82 Q101 40 94 59 Q89 69 74 67" stroke="#F8F8F2" stroke-width="5"/>
    <path d="M28 20 Q17 11 29 3 M50 20 Q39 11 51 3" stroke="#BD93F9" stroke-width="5"/>
    <path d="M30 52 L39 60 L30 68 M49 68 H62" stroke="#FF79C6" stroke-width="4"/>
  </g>
  <path d="M60 443 H840" stroke="#44475A" stroke-width="2"/>
</svg>
